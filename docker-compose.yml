version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: kanab_motors_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: kanab_admin
      POSTGRES_PASSWORD: kanab_password123
      POSTGRES_DB: kanab_motors
    ports:
      - "5433:5432" # Mapped to 5433 to avoid conflict if port 5432 is already used by local postgres service
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
